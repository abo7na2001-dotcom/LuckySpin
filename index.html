<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuckySpin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="stars stars-one"></div>
      <div class="stars stars-two"></div>

      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">LS</div>
          <div>
            <p class="brand-kicker">مبارة اليوم</p>
            <h1>LuckySpin</h1>
          </div>
        </div>

        <div class="coin-panel">
          <span class="coin-icon">◉</span>
          <span id="coinCount">1200</span>
        </div>
      </header>

      <main class="game-layout">
        <section class="wheel-stage">
          <div class="wheel-glow"></div>
          <div class="pointer" aria-hidden="true"></div>
          <div id="wheel" class="wheel" aria-label="عجلة الحظ"></div>
          <div id="wheelLabels" class="wheel-labels"></div>
          <div class="wheel-center">
            <span>SPIN</span>
          </div>
        </section>

        <aside class="side-panel">
          <div class="panel-header">
            <span class="tiny-tag">النتيجة</span>
            <h2 id="statusText">جاهز للدوران</h2>
          </div>

          <div class="result-box">
            <span class="label">الجائزة</span>
            <strong id="prizeText">--</strong>
          </div>

          <button id="spinBtn" class="spin-btn">ابدأ العجلة</button>

          <div class="legend">
            <div><span class="dot dot-one"></span> جوائز صغيرة</div>
            <div><span class="dot dot-two"></span> مكافآت متوسطة</div>
            <div><span class="dot dot-three"></span> جائزة خاصة</div>
          </div>
        </aside>
      </main>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
